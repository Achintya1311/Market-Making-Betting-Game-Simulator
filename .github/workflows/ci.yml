name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      # Bare `pytest`, not `python -m pytest`: the latter puts the cwd on sys.path
      # and hides import problems. Exit code 5 (no tests collected) is allowed
      # until the first step lands.
      - run: pytest || [ $? -eq 5 ]
